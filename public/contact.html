<!DOCTYPE html>
<html lang="en-AU" data-temp="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Joshy Bloom</title>
<meta name="description" content="Contact Joshy Bloom — enquiries, commissions and listening links.">
<meta property="og:title" content="Contact — Joshy Bloom">
<meta property="og:image" content="assets/img/opt/portrait-profile-1200.jpg">

<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<meta name="theme-color" content="#100d0b">
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="masthead">
  <a class="wordmark" href="index.html">Joshy&nbsp;Bloom</a>
  <nav class="nav" aria-label="Primary">
    <ul>
      <li><a href="index.html">Work</a></li>
      <li><a href="calendar.html">Calendar</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="main">

  <section class="section shell" data-temp-zone="ember" style="padding-block-start: clamp(8rem, 22vh, 14rem);">
    <div class="sound__grid">
      <div class="sound__text" style="position: static;">
        <h1 class="display" style="font-size: var(--step-5);">Contact</h1>
        <p class="lead reveal" style="--delay: 100ms; max-width: 24ch; margin-top: 1.5rem;">
          For enquiries, commissions and exhibitions.
        </p>

        <ul class="links reveal" style="--delay: 160ms;">
          <li>
            <a href="mailto:j89landicho@hotmail.com">
              Email <span class="arrow" aria-hidden="true">→</span>
              <span class="where">Enquiries</span>
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/joshy.bloom/" rel="me noopener">
              Instagram <span class="arrow" aria-hidden="true">→</span>
              <span class="where">@joshy.bloom</span>
            </a>
          </li>
          <li>
            <a href="https://soundcloud.com/user-360587830" rel="me noopener">
              SoundCloud <span class="arrow" aria-hidden="true">→</span>
              <span class="where">Listen</span>
            </a>
          </li>

          <li>
            <a href="https://joshybloom.bandcamp.com" rel="me noopener">
              Bandcamp <span class="arrow" aria-hidden="true">→</span>
              <span class="where">Releases</span>
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/@joshybloom" rel="me noopener">
              YouTube <span class="arrow" aria-hidden="true">→</span>
              <span class="where">@joshybloom</span>
            </a>
          </li>
        </ul>
      </div>

      <figure class="sound__a reveal" style="--delay: 200ms;">
        <div class="frame" style="aspect-ratio: 2 / 3;">
          <picture>
            <source type="image/avif" sizes="(min-width: 48rem) 32vw, 100vw"
              srcset="assets/img/opt/portrait-full-480.avif 480w, assets/img/opt/portrait-full-800.avif 800w, assets/img/opt/portrait-full-1200.avif 1200w">
            <source type="image/webp" sizes="(min-width: 48rem) 32vw, 100vw"
              srcset="assets/img/opt/portrait-full-480.webp 480w, assets/img/opt/portrait-full-800.webp 800w, assets/img/opt/portrait-full-1200.webp 1200w">
            <img src="assets/img/opt/portrait-full-800.jpg" width="2433" height="3637"
              sizes="(min-width: 48rem) 32vw, 100vw"
              srcset="assets/img/opt/portrait-full-480.jpg 480w, assets/img/opt/portrait-full-800.jpg 800w, assets/img/opt/portrait-full-1200.jpg 1200w"
              alt="Joshy standing in a white-tiled room in front of a pegboard hung with tools, wearing a printed t-shirt and shorts."
              loading="lazy" decoding="async">
          </picture>
        </div>
      </figure>

      <figure class="sound__b reveal" style="--delay: 260ms;">
        <div class="frame" style="aspect-ratio: 1 / 1;">
          <picture>
            <source type="image/avif" sizes="(min-width: 48rem) 24vw, 100vw"
              srcset="assets/img/opt/portrait-profile-480.avif 480w, assets/img/opt/portrait-profile-800.avif 800w, assets/img/opt/portrait-profile-1200.avif 1200w">
            <source type="image/webp" sizes="(min-width: 48rem) 24vw, 100vw"
              srcset="assets/img/opt/portrait-profile-480.webp 480w, assets/img/opt/portrait-profile-800.webp 800w, assets/img/opt/portrait-profile-1200.webp 1200w">
            <img src="assets/img/opt/portrait-profile-800.jpg" width="2304" height="2304"
              sizes="(min-width: 48rem) 24vw, 100vw"
              srcset="assets/img/opt/portrait-profile-480.jpg 480w, assets/img/opt/portrait-profile-800.jpg 800w, assets/img/opt/portrait-profile-1200.jpg 1200w"
              alt="Joshy in profile wearing tinted glasses and a green suit, photographed in low warm light."
              loading="lazy" decoding="async">
          </picture>
        </div>
      </figure>
    </div>
  </section>

</main>

<footer class="footer" data-temp-zone="ember">
  <div class="shell footer__grid">
    <p class="display" style="font-size: var(--step-4);">Brisbane ~ Magandjin</p>
    <p class="footer__note">&copy; <span data-year>2026</span> Joshy Bloom</p>
  </div>
</footer>

<script src="js/main.js" defer></script>
</body>
</html>
