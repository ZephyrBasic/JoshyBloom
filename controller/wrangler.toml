name = "joshybloom-calendar"
main = "worker.js"
compatibility_date = "2026-08-01"

# Not secrets — safe in the repo. The four secrets are set with
# `wrangler secret put NAME` and never appear in this file. See README.md.
[vars]
GITHUB_REPO = "ZephyrBasic/JoshyBloom"
GITHUB_BRANCH = "main"

# From the WhatsApp > API Setup page in the Meta app dashboard.
META_PHONE_ID = "REPLACE_WITH_PHONE_NUMBER_ID"

# Who is allowed to change the calendar. E.164 without the +, comma separated.
# A valid Meta signature only proves Meta sent the message, not who wrote it.
ALLOWED_NUMBERS = "REPLACE_WITH_JOSHYS_NUMBER"

[observability]
enabled = true
